<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孝行慈心化觀音｜線上書畫個展</title>
<style>
:root{
  --paper:#fbf8f1;
  --ink:#151515;
  --seal:#a72a26;
  --gold:#b9955a;
  --muted:#625b52;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--paper);
  color:var(--ink);
  font-family:"Noto Serif TC","Source Han Serif TC","PMingLiU","Microsoft JhengHei",serif;
}

.intro{
  width:100vw;
  height:100vh;
  min-height:700px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:
    radial-gradient(circle at 15% 10%, rgba(90,70,50,.045), transparent 24%),
    radial-gradient(circle at 88% 85%, rgba(90,70,50,.035), transparent 22%),
    linear-gradient(180deg,#fffdf8 0%,#f7f0e5 100%);
}

.stage{
  width:min(1180px,92vw);
  height:min(720px,86vh);
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:3vw;
  align-items:center;
}

.left{
  padding-left:2.5vw;
}

.reveal{
  opacity:0;
  transform:translateY(16px);
  animation:revealUp .65s cubic-bezier(.2,.8,.2,1) forwards;
}

.title{
  margin:0;
  font-size:clamp(34px,3.65vw,62px);
  line-height:1.18;
  letter-spacing:.08em;
  white-space:nowrap;
  font-weight:600;
  animation-delay:.35s;
}

.subtitle-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin-top:20px;
}

.subtitle{
  font-size:clamp(22px,2vw,34px);
  letter-spacing:.1em;
  animation-delay:1.1s;
}

.artist-seal{
  width:52px;
  height:52px;
  background:var(--seal);
  color:#fff;
  border-radius:4px;
  display:grid;
  grid-template-columns:1fr 1fr;
  padding:4px 5px;
  gap:2px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
  font-family:"DFKai-SB","BiauKai","KaiTi","STKaiti",serif;
  font-style:italic;
  font-weight:700;
  animation-delay:1.45s;
}

.artist-seal .stack{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:.9;
  font-size:14px;
}

.artist-seal .chen{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  transform:rotate(-4deg);
}

.english{
  margin-top:8px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(13px,1.05vw,18px);
  color:#252525;
  animation-delay:1.95s;
}

.poem{
  margin-top:42px;
  padding-left:15px;
  border-left:1px solid rgba(185,149,90,.7);
  display:grid;
  gap:12px;
  font-size:clamp(18px,1.6vw,28px);
  line-height:1.6;
  letter-spacing:.17em;
}

.poem span:nth-child(1){animation-delay:2.55s}
.poem span:nth-child(2){animation-delay:3.05s}
.poem span:nth-child(3){animation-delay:3.55s}
.poem span:nth-child(4){animation-delay:4.05s}

.hero{
  position:relative;
  height:min(620px,74vh);
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero img{
  width:min(650px,50vw);
  max-height:82vh;
  object-fit:contain;
  opacity:0;
  transform:scale(.82);
  filter:blur(6px);
  animation:heroIn 1.15s cubic-bezier(.2,.8,.2,1) forwards 4.75s;
}

.date-block{
  position:absolute;
  left:50%;
  bottom:15vh;
  transform:translateX(-50%);
  opacity:0;
  animation:dateIn .7s ease forwards 6.1s;
  text-align:center;
  white-space:nowrap;
}

.date-label{
  font-size:18px;
  margin-right:10px;
}

.date{
  font-size:clamp(30px,3.1vw,50px);
  letter-spacing:.06em;
}

.count-wrap{
  position:absolute;
  left:50%;
  bottom:3.6vh;
  transform:translateX(-50%);
  display:none;
  align-items:center;
  gap:16px;
  color:var(--gold);
}

.count-wrap.show{
  display:flex;
}

.count-label{
  font-size:11px;
  letter-spacing:.18em;
  color:#6d6256;
}

.count{
  font-family:Georgia,"Times New Roman",serif;
  font-size:34px; /* 小一點 */
  min-width:24px;
  text-align:center;
}

.skip{
  position:absolute;
  right:24px;
  bottom:18px;
  font-size:11px;
  letter-spacing:.18em;
  color:#777;
}


.location{
  margin-top:10px;
  font-size:clamp(16px,1.35vw,22px);
  letter-spacing:.08em;
  color:var(--ink);
}

@keyframes revealUp{
  to{opacity:1;transform:translateY(0)}
}

@keyframes heroIn{
  from{opacity:0;transform:scale(.82);filter:blur(6px)}
  to{opacity:1;transform:scale(1);filter:blur(0)}
}

@keyframes dateIn{
  from{opacity:0;transform:translate(-50%,12px)}
  to{opacity:1;transform:translate(-50%,0)}
}

@media(max-width:800px){
  html,body{overflow:auto}
  .intro{
    min-height:100vh;
    height:auto;
    padding:46px 0 130px;
  }
  .stage{
    grid-template-columns:1fr;
    height:auto;
    gap:24px;
  }
  .left{padding:0 6vw}
  .hero{height:42vh;min-height:330px}
  .hero img{width:min(88vw,520px);max-height:58vh}
  .date-block{
    position:relative;
    left:auto;
    bottom:auto;
    transform:none;
    margin-top:4px;
    animation-name:dateInMobile;
  }
  .count-wrap{
    position:relative;
    left:auto;
    bottom:auto;
    transform:none;
    justify-content:center;
    margin-top:18px;
  }
  @keyframes dateInMobile{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }
}



</style>

  /* 展期與地點接在佛像下方，不使用 absolute */

  /* 倒數也接續在下方 */
  .count-wrap{

  /* 操作提示改到頁面最下方，避免蓋住內容 */

/* 極窄手機再縮小主標，確保不被左右截切 */

<body>
<div class="intro" id="intro">
  <div class="stage">
    <section class="left">
      <h1 class="title reveal">孝行慈心化觀音</h1>

      <div class="subtitle-row">
        <div class="subtitle reveal">陳信佑書畫個展</div>

        <div class="artist-seal reveal" aria-label="陳信佑印章">
          <div class="stack">
            <span>信</span>
            <span>佑</span>
          </div>
          <div class="chen">陳</div>
        </div>
      </div>

      <div class="english reveal">Calligraphy Exhibition of Chen Hsin-Yu</div>

      <div class="poem">
        <span class="reveal">慈悲喜捨聖人道，</span>
        <span class="reveal">諸善起源皆行孝。</span>
        <span class="reveal">渡化人間結因緣，</span>
        <span class="reveal">細字佛圖天知曉。</span>
      </div>
    </section>

    <section class="hero">
      <img src="assets/buddha-face.png" alt="佛字與佛像主視覺">
    </section>
  </div>

  <div class="date-block">
    <span class="date-label">展期：</span>
    <span class="date">9/1–10/15</span>
    <div class="location">地點：國立金門大學</div>
  </div>

  <div class="count-wrap" id="countWrap">
    <span class="count-label">即將進入展覽首頁</span>
    <span class="count" id="count">3</span>
  </div>

  <div class="skip">點擊畫面可暫停／繼續播放</div>
</div>





<script>
(function(){
  var entered=false;
  var countWrap=document.getElementById("countWrap");
  var count=document.getElementById("count");

  var n=3;
  var timer=null;
  var countdownStarted=false;
  var paused=false;

  var remainingDelay=7000;
  var delayStartedAt=0;
  var delayTimer=null;

  /*
    只保存「按下暫停當下」仍在執行或等待中的動畫。
    已經 finished 的動畫不加入，恢復時就不會重播。
  */
  var pausedAnimations=[];

  function enter(){
    if(entered)return;
    entered=true;
    window.location.href="exhibition.html";
  }

  function tick(){
    n--;

    if(n<=0){
      clearInterval(timer);
      timer=null;
      enter();
      return;
    }

    count.textContent=n;
  }

  function startCountdown(){
    if(countdownStarted)return;

    countdownStarted=true;
    n=3;
    countWrap.classList.add("show");
    count.textContent=n;

    if(!paused){
      timer=setInterval(tick,1000);
    }
  }

  function scheduleCountdown(){
    if(countdownStarted || paused)return;

    delayStartedAt=performance.now();

    delayTimer=setTimeout(function(){
      delayTimer=null;
      remainingDelay=0;
      startCountdown();
    },remainingDelay);
  }

  function pauseIntroAnimations(){
    pausedAnimations=[];

    if(typeof document.getAnimations!=="function"){
      return;
    }

    var animations=document.getAnimations();

    for(var i=0;i<animations.length;i++){
      var animation=animations[i];

      /*
        finished：已經播放完成，完全不碰它
        idle：尚未建立有效播放狀態，也不處理
        running / pending：才需要暫停並記錄
      */
      if(
        animation.playState==="running" ||
        animation.playState==="pending"
      ){
        try{
          animation.pause();
          pausedAnimations.push(animation);
        }catch(e){}
      }
    }
  }

  function resumeIntroAnimations(){
    /*
      只繼續「剛才真正被我們暫停」的動畫。
      不重新掃描 document.getAnimations()，
      因此已完成的文字不會被 play() 重新啟動。
    */
    for(var i=0;i<pausedAnimations.length;i++){
      var animation=pausedAnimations[i];

      try{
        if(animation.playState==="paused"){
          animation.play();
        }
      }catch(e){}
    }

    pausedAnimations=[];
  }

  function pauseAll(){
    if(paused)return;

    paused=true;

    /* 1. 暫停尚未完成的文字 / 佛像 / 展期動畫 */
    pauseIntroAnimations();

    /* 2. 暫停倒數開始前的等待時間 */
    if(!countdownStarted && delayTimer){
      clearTimeout(delayTimer);
      delayTimer=null;

      var elapsed=performance.now()-delayStartedAt;
      remainingDelay=Math.max(0,remainingDelay-elapsed);
    }

    /* 3. 暫停 3 → 2 → 1 */
    if(countdownStarted && timer){
      clearInterval(timer);
      timer=null;
    }
  }

  function resumeAll(){
    if(!paused)return;

    paused=false;

    /* 只從暫停位置繼續，已完成內容保持原狀 */
    resumeIntroAnimations();

    if(!countdownStarted){
      if(remainingDelay<=0){
        startCountdown();
      }else{
        scheduleCountdown();
      }
    }else if(!timer){
      timer=setInterval(tick,1000);
    }
  }

  scheduleCountdown();

  document.addEventListener("click",function(){
    if(paused){
      resumeAll();
    }else{
      pauseAll();
    }
  });
})();
</script>
</body>
